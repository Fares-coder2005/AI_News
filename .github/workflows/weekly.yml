name: AI Weekly Digest
on:
  schedule:
    # Every Saturday at 02:00 UTC (Friday night / Saturday morning)
    - cron: "0 2 * * 6"
  workflow_dispatch: # allows manual trigger too

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnose OpenRouter connectivity
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "=== OpenRouter connectivity check ==="
          python - <<'PY'
          import os, requests, json, sys
          key = os.environ.get('OPENROUTER_API_KEY', '')
          url = 'https://openrouter.ai/api/v1/chat/completions'
          print('Key prefix:', (key[:12] + '...') if key else 'MISSING')
          print('URL:', url)
          payload = {
            'model': 'nvidia/nemotron-3-ultra-550b-a55b:free',
            'messages': [{'role': 'user', 'content': 'Reply with OK only.'}],
            'max_tokens': 4,
          }
          headers = {
            'Authorization': f'Bearer {key}',
            'Content-Type': 'application/json',
            'HTTP-Referer': 'https://github.com/Fares-coder2005/AI_News',
            'X-Title': 'AI Weekly Digest',
          }
          try:
            r = requests.post(url, headers=headers, json=payload, timeout=30)
            print('STATUS:', r.status_code)
            print('BODY:', r.text[:500])
          except Exception as e:
            print('EXCEPTION:', repr(e))
            sys.exit(1)
          PY

      - name: Run digest
        run: python src/main.py

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-log
          path: |
            *.log
            /tmp/*.log
          retention-days: 7
